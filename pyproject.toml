[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mhwceara"
version = "0.0.1"
description = "Detecção e caracterização de ondas de calor marinhas no litoral do Ceará (NOAA OISST) e resposta da clorofila-a (ESA OC-CCI)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kevin Carmo" }]
dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "netcdf4",
    "requests",
    "matplotlib",
    "geopandas",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]