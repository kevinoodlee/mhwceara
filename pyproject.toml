[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mhwceara"
version = "0.0.1"
description = "Detecção e caracterização de ondas de calor marinhas no litoral do Ceará (NOAA OISST) e resposta da clorofila-a (ESA OC-CCI)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kevin Cordeiro Ferrer" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "netcdf4",
    "requests",
    "matplotlib",
    "geopandas",
    "shapely",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W: estilo (PEP 8); F: erros (imports e variáveis sem uso); I: ordem dos imports;
# UP: sintaxe moderna; B: armadilhas comuns
select = ["E", "W", "F", "I", "UP", "B"]
